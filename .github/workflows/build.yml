name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Bundle MariaDB
        run: bash bundle/bundle-mariadb.sh

      - name: Bundle Redis
        run: bash bundle/bundle-redis.sh

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: frappe-desktop-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Bundle MariaDB
        run: bash bundle/bundle-mariadb.sh
        shell: bash

      - name: Bundle Redis
        run: bash bundle/bundle-redis.sh
        shell: bash

      - name: Build NSIS
        run: pnpm tauri build --bundles nsis

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: frappe-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
